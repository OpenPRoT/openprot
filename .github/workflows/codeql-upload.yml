name: "CodeQL SARIF Upload"

on:
  workflow_run:
    workflows: [ "CodeQL Analyze" ]
    types: [ completed ]

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

jobs:
  call-upload:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: OpenPRoT/.github/.github/workflows/reusable-codeql-upload.yml@main
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    with:
      run_id: ${{ github.event.workflow_run.id }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      head_branch: ${{ github.event.workflow_run.head_branch }}
      event_name: ${{ github.event.workflow_run.event }}
      pr_number: ${{ fromJSON(toJSON(github.event.workflow_run.pull_requests))[0].number || '' }}
