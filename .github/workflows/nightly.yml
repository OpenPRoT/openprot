name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # Run every day at 2 AM UTC
  workflow_dispatch:     # Allow manual triggering
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  nightly-build:
    name: Nightly Build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-nightly'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
      with:
        bazelisk-cache: true
        disk-cache: true
        repository-cache: true

    - name: Build
      run: |
        bazel build \
            --keep_going \
            --build_tag_filters=-hardware,-disabled \
            //...

  nightly-test:
    name: Nightly Test
    needs: nightly-build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
      with:
        bazelisk-cache: true
        disk-cache: true
        repository-cache: true

    - name: Run tests
      run: |
        bazel test \
            --keep_going \
            --test_output=streamed \
            --build_tag_filters=-hardware,-disabled \
            --test_tag_filters=-hardware,-disabled \
            //...
