name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, earlgrey-hwe ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  presubmit:
    name: Presubmit Checks
    runs-on: openprot-ci-runner
    steps:
    - uses: actions/checkout@v7

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.1
      with:
        bazelisk-cache: false
        disk-cache: false
        repository-cache: false

    - name: Presubmit Checks
      # The presubmit workflow performs formatting checks, license checks
      # C/C++ include checks and clippy lints.
      # See workflows.json for the `presubmit` definition.
      run: ./pw presubmit

  test:
    name: Test
    needs: presubmit
    runs-on: openprot-ci-runner
    steps:
    - uses: actions/checkout@v7

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.1
      with:
        bazelisk-cache: false
        disk-cache: false
        repository-cache: false

    - name: Run tests
      # See workflows.json for the `ci` definition.
      run: ./pw ci

  build:
    name: Build Targets
    needs: test
    runs-on: openprot-ci-runner

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.1
      with:
        bazelisk-cache: false
        disk-cache: false
        repository-cache: false

    - name: Build
      # See workflows.json for the `default` definition.
      run: ./pw default

  security-audit:
    name: Security Audit
    needs: presubmit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Install cargo-deny
      run: cargo install cargo-deny --version 0.19.0 --locked

    - name: Run security audit
      run: cd third_party/crates_io; cargo audit

    - name: Run cargo deny checks
      run: cd third_party/crates_io; cargo deny check

    - name: Set up Python for semgrep
      # semgrep==1.86.0 pins pydantic~=2.8.2 -> pydantic-core==2.20.1, which
      # ships prebuilt wheels up to CPython 3.13 but none for 3.14. On a
      # runner image whose default Python is 3.14 (e.g. ubuntu-26.04) pip
      # falls back to building pydantic-core from source, and that fails
      # because its pyo3 version caps at 3.13. Pin an interpreter with
      # prebuilt wheels so this doesn't depend on the runner image default.
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install semgrep
      run: pip install --quiet "semgrep==1.86.0"

    - name: Test semgrep rules
      # Each rule in .semgrep/rules/*.yml has fixtures (same basename, .rs)
      # with `ruleid:`/`ok:` annotations. This fails if a rule stops matching
      # its positive case or starts matching its negative case, so a rule
      # that silently matches nothing cannot pass CI.
      run: semgrep --test --metrics=off .semgrep/rules

    - name: Run semgrep security scan
      # Uses the semgrep CLI directly (pinned version) rather than the
      # legacy returntocorp/semgrep-action@v1 wrapper, which was found to
      # silently swallow rule-schema errors and exit 0 without ever
      # completing a scan (see PR discussion). Direct CLI invocation with
      # --error gives a deterministic, visible exit code.
      run: semgrep scan --config p/rust --error

    - name: Run semgrep parsing-safety rules
      # Project-specific rules targeting wire/protocol decode paths
      # (no unwrap/expect, no raw buffer indexing, no unchecked length
      # arithmetic/casts). Non-blocking until the ruleset has been
      # validated against the full codebase; flip to blocking once the
      # false-positive rate has been confirmed acceptable.
      continue-on-error: true
      run: semgrep scan --config .semgrep/rules/parsing-safety.yml --error

    - name: Run semgrep OpenPRoT security audit rules
      # Project-specific rules based on the comprehensive OpenPRoT security
      # audit, targeting anti-rollback enforcement, I2C interrupt handling,
      # and wire-level protocol state machine errors. These rules now scan
      # target/ (previously excluded by .semgrepignore) and report real
      # findings in the AST10x0 I2C slave driver and the orchestrator
      # driver. Non-blocking until the owners have triaged them; flip to
      # blocking (remove continue-on-error) once findings are fixed or
      # explicitly suppressed. The "Test semgrep rules" step above remains
      # blocking.
      continue-on-error: true
      run: semgrep scan --config .semgrep/rules/openprot-security.yml --error
