#
# Caliptra embedded crate workspace for crate_universe.
# These are caliptra-domain-specific crates used by embedded targets
# (riscv32imc-unknown-none-elf). No alloc-requiring features.

[package]
name = "rust_caliptra_crates"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
path = "fake.rs"

[dependencies]
# Caliptra embedded crates
caliptra-api = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59", default-features = false }
caliptra-api-types = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59", default-features = false }
caliptra-error = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59", default-features = false }
caliptra-image-types = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59", default-features = false }
caliptra-okref = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59", default-features = false }
caliptra-lms-types = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59", default-features = false }
caliptra-auth-man-types = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59", default-features = false }
caliptra-registers = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59", default-features = false }
caliptra-ureg = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59", default-features = false }
caliptra-x509 = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59", default-features = false }
caliptra-ocp-eat = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "b99535ded32492d6c23bbc56f95e787a1e275b59", default-features = false }
caliptra-cfi-lib = { git = "https://github.com/chipsalliance/caliptra-cfi", rev = "72c75dc70cde4120a9ce149d4f5cb21621399958", default-features = false, features = ["cfi", "cfi-counter"] }
caliptra-cfi-derive = { git = "https://github.com/chipsalliance/caliptra-cfi", rev = "72c75dc70cde4120a9ce149d4f5cb21621399958" }
caliptra-dpe-platform = { git = "https://github.com/chipsalliance/caliptra-dpe", rev = "f2b7121b69aa2bd05e69cee57f7a6993a07e5fef", default-features = false }
caliptra-dpe-crypto = { git = "https://github.com/chipsalliance/caliptra-dpe", rev = "f2b7121b69aa2bd05e69cee57f7a6993a07e5fef", default-features = false }
caliptra-dpe = { git = "https://github.com/chipsalliance/caliptra-dpe", rev = "f2b7121b69aa2bd05e69cee57f7a6993a07e5fef", default-features = false, features = ["hybrid"] }
caliptra-dpe-response-buffer = { git = "https://github.com/chipsalliance/caliptra-dpe", rev = "f2b7121b69aa2bd05e69cee57f7a6993a07e5fef", default-features = false }

# MCU embedded crates
caliptra-mcu-error = { git = "https://github.com/chipsalliance/caliptra-mcu-sw", rev = "8c9c8ff27de1babf63c0be74e973185837439040", default-features = false }
caliptra-mcu-registers-generated = { git = "https://github.com/chipsalliance/caliptra-mcu-sw", rev = "8c9c8ff27de1babf63c0be74e973185837439040", default-features = false }
caliptra-mcu-config = { git = "https://github.com/chipsalliance/caliptra-mcu-sw", rev = "8c9c8ff27de1babf63c0be74e973185837439040", default-features = false }
caliptra-mcu-config-emulator = { git = "https://github.com/chipsalliance/caliptra-mcu-sw", rev = "8c9c8ff27de1babf63c0be74e973185837439040", default-features = false }
caliptra-mcu-config-fpga = { git = "https://github.com/chipsalliance/caliptra-mcu-sw", rev = "8c9c8ff27de1babf63c0be74e973185837439040", default-features = false }
caliptra-mcu-image-header = { git = "https://github.com/chipsalliance/caliptra-mcu-sw", rev = "8c9c8ff27de1babf63c0be74e973185837439040", default-features = false }
caliptra-mcu-flash-image = { git = "https://github.com/chipsalliance/caliptra-mcu-sw", rev = "8c9c8ff27de1babf63c0be74e973185837439040", default-features = false }
caliptra-mcu-mbox-common = { git = "https://github.com/chipsalliance/caliptra-mcu-sw", rev = "8c9c8ff27de1babf63c0be74e973185837439040", default-features = false }
caliptra-mcu-otp-digest = { git = "https://github.com/chipsalliance/caliptra-mcu-sw", rev = "8c9c8ff27de1babf63c0be74e973185837439040", default-features = false }
caliptra-mcu-otp-fuse = { git = "https://github.com/chipsalliance/caliptra-mcu-sw", rev = "8c9c8ff27de1babf63c0be74e973185837439040", default-features = false }
caliptra-mcu-otp-lifecycle = { git = "https://github.com/chipsalliance/caliptra-mcu-sw", rev = "8c9c8ff27de1babf63c0be74e973185837439040", default-features = false }
caliptra-mcu-ocp = { git = "https://github.com/chipsalliance/caliptra-mcu-sw", rev = "8c9c8ff27de1babf63c0be74e973185837439040", default-features = false }

# Caliptra-only utility crates
arrayvec = { version = "0.7.6", default-features = false }
constant_time_eq = { version = "0.4.2", default-features = false }
panic-halt = "1.0.0"
riscv-csr = { git = "https://github.com/tock/tock.git", rev = "release-2.2" }
rv32i = { git = "https://github.com/tock/tock.git", rev = "release-2.2" }
ufmt = "0.2.0"
# Shared crates needed for type compatibility and platform-switching aliases
bitfield = "0.14.0"
bitfield-struct = "0.11.0"
bitflags = "2.9.1"
cfg-if = "1.0.0"
log = "0.4.26"
memoffset = "0.9.1"
paste = "1.0.15"
proc-macro2 = "1.0.104"
quote = "1.0.38"
riscv = "0.12.1"
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
smlang = { version = "0.8.0", default-features = false }
serde_derive = "1.0.228"
syn = { version = "2.0.104", features = ["full", "extra-traits"] }
syn1 = { package = "syn", version = "1.0.109", features = ["full", "extra-traits"] }
tock-registers = "0.9.0"
zerocopy = { version = "0.8.48", default-features = false, features = ["derive"] }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }

# No [patch] section needed — deps already point to the upstream GitHub rev.
# The Bazel git_repository rules handle local source.

[patch.crates-io]
# Tock patches
tock-registers = { git = "https://github.com/tock/tock.git", rev = "release-2.2" }
riscv-csr = { git = "https://github.com/tock/tock.git", rev = "release-2.2" }
rv32i = { git = "https://github.com/tock/tock.git", rev = "release-2.2" }

# ufmt patch
ufmt = { git = "https://github.com/korran/ufmt.git", rev = "1d0743c1ffffc68bc05ca8eeb81c166192863f33", features = ["inline"] }
ufmt-write = { git = "https://github.com/korran/ufmt.git", rev = "1d0743c1ffffc68bc05ca8eeb81c166192863f33" }
ufmt-macros = { git = "https://github.com/korran/ufmt.git", rev = "1d0743c1ffffc68bc05ca8eeb81c166192863f33" }
